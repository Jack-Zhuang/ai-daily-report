name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx beautifulsoup4 lxml python-dotenv

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          # 测试用假 key，真实 key 走 repository secrets 注入
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY || 'test-dummy-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-dummy-key' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'test-dummy-key' }}
